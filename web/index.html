<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiket Event Kampus</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
    section { border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1rem 1.25rem; margin: 1.25rem 0; }
    button { padding: .5rem 1rem; margin-right: .5rem; cursor: pointer; }
    input { padding: .4rem; margin: .25rem 0; }
    pre { background: #f4f4f5; padding: 1rem; border-radius: .5rem; overflow: auto; min-height: 3rem; }
    img { max-width: 100%; border-radius: .5rem; margin-top: .75rem; }
    .ok { color: #15803d; } .bad { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Tiket Event Kampus</h1>
  <p>Tahap inisiasi: cek API dan unggah foto event. Info event, booking, dan absensi menyusul.</p>

  <section>
    <h2>1. Status API</h2>
    <button id="h">GET /api/health</button>
    <button id="a">GET /api/health/aws</button>
    <p id="status"></p>
    <pre id="out">Klik salah satu tombol.</pre>
  </section>

  <section>
    <h2>2. Unggah foto event</h2>
    <label>ID event: <input id="evt" value="demo-001" maxlength="64"></label><br>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp"><br>
    <button id="up">Unggah ke S3</button>
    <p id="upstatus"></p>
    <img id="preview" alt="" hidden>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);

    async function call(path) {
      $("status").textContent = "memanggil " + path + " ...";
      try {
        const r = await fetch(path);
        const text = await r.text();
        let shown = text;
        try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
        $("status").textContent = "HTTP " + r.status;
        $("status").className = r.ok ? "ok" : "bad";
        $("out").textContent = shown;
      } catch (e) {
        $("status").textContent = "gagal: " + e;
        $("status").className = "bad";
      }
    }
    $("h").onclick = () => call("/api/health");
    $("a").onclick = () => call("/api/health/aws");

    // Alur: minta presigned URL -> PUT file langsung ke S3 -> tampilkan lewat CloudFront
    $("up").onclick = async () => {
      const f = $("file").files[0], st = $("upstatus");
      if (!f) { st.textContent = "pilih file dulu"; st.className = "bad"; return; }
      try {
        st.className = ""; st.textContent = "meminta URL unggah ...";
        const q = new URLSearchParams({ event_id: $("evt").value.trim(), content_type: f.type });
        const r = await fetch("/api/photos/upload-url?" + q);
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));

        st.textContent = "mengunggah ke S3 ...";
        const put = await fetch(j.upload_url, { method: j.method, headers: j.headers, body: f }); // Content-Type harus sama
        if (!put.ok) throw new Error("S3 menolak unggahan: HTTP " + put.status);

        st.textContent = "berhasil: " + j.key; st.className = "ok";
        setTimeout(() => { const img = $("preview"); img.src = j.view_path + "?t=" + Date.now(); img.hidden = false; }, 1500);
      } catch (e) {
        st.textContent = "gagal: " + e.message; st.className = "bad";
      }
    };
  </script>
</body>
</html>
